<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V3EStore</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='registro.css') }}">
    <style>
    .submit-btn.disabled { opacity: 0.5; cursor: not-allowed; }
    .glass-container.small {
        width: 92%;
        max-width: 540px;
        padding: 12px 16px;
        margin: 18px auto;
        border-radius: 14px;
    }
    .form-group { margin-bottom: 10px; }
    label { font-size: 0.92rem; }
    input { padding: 10px 12px; font-size: 0.98rem; }
    .submit-btn { padding: 10px 12px; border-radius: 10px; font-weight:700; }
    .submit-btn.enabled { background: linear-gradient(90deg,#ffa3d1 0%, #d16099 100%); color:#fff; box-shadow:0 12px 30px rgba(216,27,120,0.14); }
    @keyframes btn-jump { 0% { transform: translateY(0); } 50% { transform: translateY(-6px); } 100% { transform: translateY(0); } }
    .submit-btn:hover { animation: btn-jump 0.34s ease forwards; }
    .submit-btn:active { transform: translateY(-2px) scale(0.998); }
    </style>
</head>
<body>
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endif %}
{% endwith %}
    <div class="glass-container small">
        <div class="header">
            <h1>Crear Cuenta</h1>
            <p>V3E Store, la mejor decisión para tus compras</p>
            <p>¡Gracias por elegirnos!</p>
        </div>

        <form method="post" id="registroForm">
            <div class="form-group">
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Ingresa tu nombre completo">
            </div>

            <div class="form-group">
                <label for="documento">Número de documento:</label>
                <input type="text" id="documento" name="documento" required placeholder="Ej: 12345678A">
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="tu@email.com">
            </div>

            <div class="form-group">
                <label for="usuario">Nombre de usuario:</label>
                <input type="text" id="usuario" name="usuario" required placeholder="Elige un nombre único">
            </div>

            <div class="form-group">
                <label for="fecha_nacimiento">Fecha de nacimiento:</label>
                <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required placeholder="Mínimo 6 caracteres">
            </div>

            <div class="form-group">
                <button type="submit" id="crearCuentaBtn" class="submit-btn enabled">Crear Cuenta</button>
            </div>
            <div class="form-actions">
                <a href="{{ url_for('login') }}" class="secondary-btn">Ya tengo cuenta</a>
                <a href="{{ url_for('index') }}" class="secondary-btn">Volver al inicio</a>
            </div>
        </form>
        <div id="mensaje"></div>
    </div>
</body>
</html>
