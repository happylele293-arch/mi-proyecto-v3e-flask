<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | V3E STORE</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='registro.css') }}">
</head>
<body>
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endif %}
{% endwith %}
    <div class="glass-container small">
        <div class="header">
            <h1>Iniciar Sesión</h1>
            <p>Accede a tu experiencia V3E Store</p>
        </div>

        <form method="post">
            <div class="form-group">
                <label for="usuario">Correo o usuario:</label>
                <input type="text" id="usuario" name="usuario" required placeholder="tu@email.com o tu usuario">
            </div>

            <div class="form-group">
                <label for="clave">Contraseña:</label>
                <input type="password" id="clave" name="clave" required placeholder="••••••••">
            </div>

            <div class="form-group">
                <button type="submit" class="submit-btn enabled">Entrar</button>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('registro') }}" class="secondary-btn">Crear cuenta</a>
                <a href="{{ url_for('index') }}" class="secondary-btn">Volver al inicio</a>
            </div>
        </form>
    </div>
</body>
</html>
